name: Unzip Project

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and move files to repo root
        id: unzip
        run: |
          shopt -s nullglob dotglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No zip file in repo root, nothing to do."
            echo "done=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -rf _unzip_tmp && mkdir _unzip_tmp
          for z in "${zips[@]}"; do
            unzip -q -o "$z" -d _unzip_tmp
            git rm -q -f "$z"
          done
          # If the zip contains a single top-level folder, use its contents as the repo root
          entries=(_unzip_tmp/*)
          if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
            cp -a "${entries[0]}"/. .
          else
            cp -a _unzip_tmp/. .
          fi
          rm -rf _unzip_tmp
          echo "done=true" >> "$GITHUB_OUTPUT"

      - name: Commit extracted files
        if: steps.unzip.outputs.done == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unzip project files"
          git push
          
