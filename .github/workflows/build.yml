name: Build APK

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Unzip Project"]
    types: [completed]
  push:
    branches: [main]
    paths-ignore:
      - "*.zip"
      - "README.md"

jobs:
  build:
    # For workflow_run, only build when the unzip run succeeded
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Check project exists
        run: |
          if [ ! -f settings.gradle.kts ]; then
            echo "settings.gradle.kts not found. Unzip the project first."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The ubuntu-latest runner already ships with the Android SDK (ANDROID_HOME).
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ae-studio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
